<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Still — Atmosphere Channels</title>
<meta name="theme-color" content="#edf1f3">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf1f3;overscroll-behavior:none;font-family:Arial,Helvetica,sans-serif;color:#68767d}
#canvas{display:block;outline:none;touch-action:none;width:100vw!important;height:100vh!important}
#status{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(0deg,transparent 0 3px,#c7d6de12 3px 4px),radial-gradient(ellipse at 50% 32%,#fff 0%,#f1f4f5 52%,#dce4e8 100%)}
.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(540px,78vw);margin-bottom:34px}
.channel{height:clamp(40px,6.5vw,70px);border:2px solid #c1cdd3;border-radius:13px;background:linear-gradient(#fff,#e6ecef);box-shadow:0 2px 2px #82939f22,inset 0 2px 1px #fff;animation:breathe 3s ease-in-out infinite;animation-delay:calc(var(--i)*.16s)}
@keyframes breathe{0%,65%,100%{border-color:#c1cdd3;box-shadow:0 2px 2px #82939f22,inset 0 2px 1px #fff}25%{border-color:#6ec2e3;box-shadow:0 0 10px #80d8f34d,inset 0 2px 1px #fff}}
.brand{font-size:clamp(38px,6vw,52px);font-weight:400;letter-spacing:-2px;margin:0;color:#71838b;text-shadow:0 2px white}
.subtitle{font-size:12px;letter-spacing:3px;text-transform:uppercase;margin:9px 0 35px;color:#8d9ca3}
.loading-line{display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px;margin:0 0 13px}
.spinner{width:15px;height:15px;border:2px solid #cfdde3;border-top-color:#50b8df;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#status-progress{display:none;width:min(240px,60vw);height:8px;border:1px solid #c4d3da;border-radius:8px;background:#e0e8ec;overflow:hidden;appearance:none}
#status-progress::-webkit-progress-bar{background:#e0e8ec;border-radius:8px}#status-progress::-webkit-progress-value{background:linear-gradient(#93d9ed,#50b6dd);border-radius:8px}#status-progress::-moz-progress-bar{background:#68c4e4;border-radius:8px}
#status-notice{display:none;max-width:min(500px,85vw);padding:18px;border:1px solid #c4d3da;border-radius:14px;background:#fff;color:#566770;line-height:1.5;text-align:center;font-size:14px}
.dock{position:absolute;bottom:-40px;left:-5%;width:110%;height:115px;border-radius:50% 50% 0 0;border-top:3px solid #74c9e7;background:linear-gradient(#fff,#dae3e8);box-shadow:0 -3px 14px #849dac20;text-align:center;padding-top:25px;font-size:12px;letter-spacing:1px;color:#82959f}
@media(max-height:530px){.channels{margin-bottom:12px;gap:7px;width:340px;max-width:70vw}.channel{height:33px;border-radius:9px}.brand{font-size:32px}.subtitle{margin:6px 0 15px}.dock{height:83px;padding-top:12px}.loading-line{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){.channel,.spinner{animation:none}.spinner{border-color:#72c5e3}}
</style>

<script>
function fitGameCanvas(){const c=document.getElementById('canvas');if(!c)return;const w=Math.max(1,Math.round(innerWidth)),h=Math.max(1,Math.round(innerHeight));if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;}
addEventListener('DOMContentLoaded',()=>{fitGameCanvas();new ResizeObserver(fitGameCanvas).observe(document.documentElement);});addEventListener('resize',fitGameCanvas);
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

<div id="status" role="status" aria-label="Loading atmosphere channels">
<div class="channels" aria-hidden="true"><div class="channel" style="--i:0"></div><div class="channel" style="--i:1"></div><div class="channel" style="--i:2"></div><div class="channel" style="--i:3"></div><div class="channel" style="--i:4"></div><div class="channel" style="--i:5"></div><div class="channel" style="--i:6"></div><div class="channel" style="--i:7"></div><div class="channel" style="--i:8"></div><div class="channel" style="--i:9"></div><div class="channel" style="--i:10"></div><div class="channel" style="--i:11"></div></div>
<h1 class="brand">Still</h1><p class="subtitle">Atmosphere channels</p>
<p class="loading-line"><span class="spinner" aria-hidden="true"></span><span id="loading-label">Opening your channels…</span></p>
<progress id="status-progress" aria-label="Download progress"></progress><div id="status-notice" role="alert"></div>
<div class="dock" aria-hidden="true">A little time, somewhere else.</div>
</div>

		<script src="pack.js"></script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":137529984,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
GODOT_CONFIG.mainPack = STILL_PACK.file;
delete GODOT_CONFIG.fileSizes[GODOT_CONFIG.executable + '.pck'];
GODOT_CONFIG.fileSizes[STILL_PACK.file] = STILL_PACK.size;
GODOT_CONFIG.fileSizes[STILL_PACK.extra.file] = STILL_PACK.extra.size;
GODOT_CONFIG.onProgress = function(current,total) {
    const progress = document.getElementById('status-progress');
    if (!progress) return;
    if (current > 0 && total > 0) {
        progress.value=current; progress.max=total;
        document.getElementById('loading-label').textContent=current>=total?'Preparing your channels…':'Opening your channels… '+Math.floor(current/total*100)+'%';
    } else { progress.removeAttribute('value'); progress.removeAttribute('max'); }
};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
        document.querySelector('.loading-line').style.display = mode === 'notice' ? 'none' : 'flex';
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		Promise.all([
            engine.init(GODOT_CONFIG.executable),
            engine.preloadFile(STILL_PACK.file),
            engine.preloadFile(STILL_PACK.extra.file)
        ]).then(() => engine.start({args:[...GODOT_CONFIG.args,'--main-pack',STILL_PACK.file]})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
