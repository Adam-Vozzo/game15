html/head_include="<meta name=\"theme-color\" content=\"#10191b\"><style>html,body{background:#10191b;overscroll-behavior:none}canvas{touch-action:none;width:100vw!important;height:100vh!important}#status{background:#10191b!important}</style><script>function fitGameCanvas(){const c=document.getElementById('canvas');if(!c)return;const w=Math.max(1,Math.round(innerWidth)),h=Math.max(1,Math.round(innerHeight));if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;}addEventListener('DOMContentLoaded',()=>{fitGameCanvas();new ResizeObserver(fitGameCanvas).observe(document.documentElement);});addEventListener('resize',fitGameCanvas);</script>"
